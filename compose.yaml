services:
  postgres:
    image: postgres:17
    container_name: atlaspay-finance-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: atlaspay_finance
      POSTGRES_USER: atlaspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - finance_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlaspay -d atlaspay_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finance_postgres_data: